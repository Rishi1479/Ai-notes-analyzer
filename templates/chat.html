<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat — NotesApp</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    height: 100vh; display: flex; flex-direction: column;
    background: #0f0f1a; color: #e2e8f0; overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed; width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
    bottom: 0; left: -100px; border-radius: 50%;
    pointer-events: none;
    animation: blob 10s ease-in-out infinite;
  }
  @keyframes blob { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-30px)} }

  /* Navbar */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; height: 64px; flex-shrink: 0;
    background: rgba(15,15,26,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    z-index: 10;
  }
  .nav-left { display: flex; align-items: center; gap: 14px; }
  .back-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px;
    background: rgba(255,255,255,0.05);
    color: #94a3b8; text-decoration: none;
    border-radius: 8px; font-size: 13px; font-weight: 500;
    border: 1px solid rgba(255,255,255,0.08); transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.09); color: #e2e8f0; }
  .ai-badge {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 600;
    background: linear-gradient(135deg, #818cf8, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .ai-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px rgba(52,211,153,0.6);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:0.7} }

  /* Chat area */
  .chat-area {
    flex: 1; overflow-y: auto;
    padding: 28px 0; display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .chat-wrapper { max-width: 820px; width: 100%; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 16px; }

  /* Welcome message */
  .welcome {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 40px 20px 20px;
    gap: 12px;
  }
  .welcome-icon {
    width: 64px; height: 64px; border-radius: 20px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(99,102,241,0.4);
    margin-bottom: 8px;
  }
  .welcome h2 { font-size: 22px; font-weight: 700; color: #e2e8f0; }
  .welcome p { color: #64748b; font-size: 14px; max-width: 380px; line-height: 1.6; }

  /* Messages */
  .msg { display: flex; gap: 12px; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
  }
  .avatar.user-av { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; font-size: 13px; }
  .avatar.ai-av { background: linear-gradient(135deg, #0f172a, #1e293b); border: 1px solid rgba(255,255,255,0.08); }

  .bubble {
    max-width: 75%; padding: 12px 16px; border-radius: 14px;
    font-size: 14px; line-height: 1.65;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white; border-radius: 14px 4px 14px 14px;
  }
  .msg.ai .bubble {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #cbd5e1; border-radius: 4px 14px 14px 14px;
  }

  /* Formatted AI response content */
  .msg.ai .bubble h1, .msg.ai .bubble h2, .msg.ai .bubble h3 {
    color: #e2e8f0; margin: 12px 0 6px; font-weight: 600;
  }
  .msg.ai .bubble h1 { font-size: 1.15em; }
  .msg.ai .bubble h2 { font-size: 1.08em; }
  .msg.ai .bubble h3 { font-size: 1em; }
  .msg.ai .bubble p { margin: 6px 0; line-height: 1.7; }
  .msg.ai .bubble ul, .msg.ai .bubble ol {
    margin: 6px 0 6px 20px; padding: 0;
  }
  .msg.ai .bubble li { margin: 4px 0; line-height: 1.65; }
  .msg.ai .bubble code {
    background: rgba(255,255,255,0.08); padding: 2px 6px;
    border-radius: 4px; font-size: 0.9em; font-family: 'Menlo', 'Courier New', monospace;
  }
  .msg.ai .bubble pre {
    background: rgba(0,0,0,0.3); padding: 12px 14px;
    border-radius: 8px; overflow-x: auto; margin: 8px 0;
    font-size: 0.88em;
  }
  .msg.ai .bubble pre code {
    background: transparent; padding: 0;
  }
  .msg.ai .bubble strong { color: #e2e8f0; font-weight: 600; }
  .msg.ai .bubble hr {
    border: none; border-top: 1px solid rgba(255,255,255,0.1);
    margin: 10px 0;
  }

  /* Typing indicator */
  .typing { display: none; }
  .typing.visible { display: flex; }
  .typing .bubble { display: flex; align-items: center; gap: 5px; padding: 14px 18px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #64748b; animation: bounce 1.2s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

  /* Input bar */
  .input-bar {
    padding: 16px 24px 24px; flex-shrink: 0;
    background: rgba(15,15,26,0.8);
    border-top: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
  }
  .input-inner {
    max-width: 820px; margin: 0 auto;
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 6px 6px 6px 18px;
    transition: border-color 0.2s;
  }
  .input-inner:focus-within { border-color: rgba(99,102,241,0.5); }

  #question {
    flex: 1; background: transparent; border: none; outline: none;
    color: #e2e8f0; font-size: 14px; font-family: 'Inter', sans-serif;
    padding: 8px 0;
  }
  #question::placeholder { color: #475569; }

  .send-btn {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; color: white;
  }
  .send-btn:hover { transform: scale(1.08); box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
  .send-btn:active { transform: scale(0.96); }
  .send-btn svg { width: 18px; height: 18px; }

  .input-hint { text-align: center; font-size: 12px; color: #334155; margin-top: 10px; }
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a class="back-btn" href="javascript:history.back()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back
    </a>
    <div class="ai-badge">
      <div class="ai-dot"></div>
      AI Note Analyzer
    </div>
  </div>
  <a class="back-btn" href="{% url 'logout' %}" style="color:#f87171;border-color:rgba(239,68,68,0.2);background:rgba(239,68,68,0.08)">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Logout
  </a>
</nav>

<div class="chat-area" id="chat-area">
  <div class="chat-wrapper" id="chat">
    <div class="welcome">
      <div class="welcome-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M12 2a10 10 0 1 0 10 10H12z"/><path d="M12 6v6l4 2"/>
        </svg>
      </div>
      <h2>PDF ready for questions</h2>
      <p>Ask me anything about this note. I'll find the most relevant content and answer using AI.</p>
    </div>

    <div class="msg ai typing" id="typing">
      <div class="avatar ai-av">🤖</div>
      <div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
  </div>
</div>

<div class="input-bar">
  <div class="input-inner">
    <input id="question" type="text" placeholder="Ask a question about this PDF..." autocomplete="off">
    <button class="send-btn" onclick="ask()" id="send-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <div class="input-hint">Powered by gemma4:e2b via Ollama • Press Enter to send</div>
</div>

<script>
  const chat = document.getElementById("chat");
  const typing = document.getElementById("typing");
  const input = document.getElementById("question");
  const chatArea = document.getElementById("chat-area");

  function scrollBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  /* Lightweight markdown → HTML converter */
  function mdToHtml(md) {
    let html = md;
    // Code blocks (``` ... ```)
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Headings
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    // Bold + italic
    html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Horizontal rule
    html = html.replace(/^---$/gm, '<hr>');
    // Unordered list items (*, -, +)
    html = html.replace(/^[\*\-\+] (.+)$/gm, '<li>$1</li>');
    // Ordered list items
    html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');
    // Wrap consecutive <li> blocks in <ul>
    html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
    // Paragraphs: split by double newline
    html = html.split(/\n{2,}/).map(block => {
      block = block.trim();
      if (!block) return '';
      if (/^<[hupol]/.test(block)) return block;
      return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');
    // Single newlines that remain (inside a paragraph)
    return html;
  }

  function addMsg(role, text) {
    const isUser = role === "user";
    const rendered = isUser ? text : mdToHtml(text);
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar ${isUser ? 'user-av' : 'ai-av'}">${isUser ? 'You' : '🤖'}</div>
      <div class="bubble">${rendered}</div>
    `;
    chat.insertBefore(div, typing);
    scrollBottom();
  }

  async function ask() {
    const q = input.value.trim();
    if (!q) return;

    input.value = "";
    input.disabled = true;
    document.getElementById("send-btn").disabled = true;

    addMsg("user", q);
    typing.classList.add("visible");
    scrollBottom();

    try {
      const res = await fetch("/ask/", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          "X-CSRFToken": "{{ csrf_token }}"
        },
        body: `question=${encodeURIComponent(q)}&note_id={{ note_id }}`
      });
      const data = await res.json();
      typing.classList.remove("visible");
      addMsg("ai", data.answer);
    } catch(e) {
      typing.classList.remove("visible");
      addMsg("ai", "⚠️ Something went wrong. Make sure Ollama is running.");
    } finally {
      input.disabled = false;
      document.getElementById("send-btn").disabled = false;
      input.focus();
    }
  }

  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });
</script>

</body>
</html>
