<!DOCTYPE html>
<html>
<head>
<title>Ask Questions About PDF</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6fb;
    margin:0;
}

.header{
    background:#4a6cf7;
    color:white;
    padding:20px;
    text-align:center;
    font-size:22px;
}

.container{
    width:70%;
    margin:30px auto;
}

.chat-box{
    background:white;
    height:400px;
    overflow-y:auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.user{
    background:#4a6cf7;
    color:white;
    padding:10px;
    border-radius:8px;
    margin:10px 0;
    width:fit-content;
}

.ai{
    background:#e9ecef;
    padding:10px;
    border-radius:8px;
    margin:10px 0;
    width:fit-content;
}

.input-area{
    margin-top:15px;
    display:flex;
}

input{
    flex:1;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    margin-left:10px;
    padding:10px 20px;
    background:#4a6cf7;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#354edb;
}

</style>

</head>

<body>

<div class="header">
Ask Questions About PDF
</div>

<div class="container">

<div id="chat" class="chat-box"></div>

<div class="input-area">
<input id="question" placeholder="Ask something about the notes...">
<button onclick="ask()">Ask</button>
</div>

</div>

<script>

function ask(){

let q = document.getElementById("question").value;

fetch("/ask/",{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded",
"X-CSRFToken":"{{csrf_token}}"
},

body:`question=${q}&note_id={{note_id}}`

})
.then(res=>res.json())
.then(data=>{

document.getElementById("chat").innerHTML +=
`<div class="user"><b>You:</b> ${q}</div>`;

document.getElementById("chat").innerHTML +=
`<div class="ai"><b>AI:</b> ${data.answer}</div>`;

document.getElementById("question").value="";

});

}

</script>

</body>
</html>
